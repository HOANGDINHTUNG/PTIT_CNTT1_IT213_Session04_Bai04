spring.application.name=incident-stream

# Cấu hình Spring AI OpenAI (Ví dụ, hãy ghi đè bằng biến môi trường thực tế)
spring.ai.openai.api-key=${OPENAI_API_KEY:YOUR_DEFAULT_API_KEY}
spring.ai.openai.chat.options.model=gpt-3.5-turbo

# Có thể bật log cho WebFlux để debug
logging.level.org.springframework.web.reactive=INFO
